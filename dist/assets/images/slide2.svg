<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b6b"/><stop offset="100%" stop-color="#0d0a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky2)"/>
  <!-- parallel lines -->
  <line x1="60" y1="220" x2="740" y2="220" stroke="#38bdf8" stroke-width="8"/>
  <line x1="60" y1="420" x2="740" y2="420" stroke="#38bdf8" stroke-width="8"/>
  <!-- arrow tick marks for parallel -->
  <g stroke="#38bdf8" stroke-width="6">
    <line x1="690" y1="205" x2="710" y2="225"/>
    <line x1="690" y1="405" x2="710" y2="425"/>
  </g>
  <!-- transversal -->
  <line x1="230" y1="80" x2="570" y2="560" stroke="#facc15" stroke-width="8"/>
  <!-- intersection points -->
  <circle cx="330" cy="220" r="8" fill="#fff"/>
  <circle cx="470" cy="420" r="8" fill="#fff"/>
  <!-- angle number labels 1-4 top, 5-8 bottom -->
  <g font-family="Nunito, sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">
    <text x="300" y="190">1</text><text x="370" y="190">2</text>
    <text x="295" y="255">3</text><text x="365" y="255">4</text>
    <text x="440" y="390">5</text><text x="510" y="390">6</text>
    <text x="435" y="455">7</text><text x="505" y="455">8</text>
  </g>
  <text x="400" y="70" fill="#facc15" font-family="Georgia, serif" font-size="30" font-weight="900" text-anchor="middle">1 Transversal → 8 Angles</text>
  <rect x="270" y="500" width="260" height="60" rx="16" fill="#1e0e45" stroke="#facc15" stroke-width="3"/>
  <text x="400" y="538" fill="#facc15" font-family="monospace" font-size="24" font-weight="900" text-anchor="middle">4 + 4 = 8 angles</text>
</svg>
