<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b6b"/>
      <stop offset="55%" stop-color="#1a0f4e"/>
      <stop offset="100%" stop-color="#0d0a2e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky1)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="70" r="2.5"/><circle cx="160" cy="120" r="1.8"/><circle cx="260" cy="60" r="2"/>
    <circle cx="360" cy="100" r="1.5"/><circle cx="470" cy="55" r="2.2"/><circle cx="600" cy="90" r="1.8"/>
    <circle cx="700" cy="130" r="2.4"/><circle cx="730" cy="60" r="1.6"/><circle cx="120" cy="180" r="1.4"/>
    <circle cx="640" cy="170" r="1.6"/>
  </g>
  <!-- moon -->
  <circle cx="660" cy="110" r="46" fill="#fef9c3" opacity="0.9"/>
  <circle cx="678" cy="98" r="46" fill="#2d1b6b" opacity="0.55"/>
  <!-- ground -->
  <polygon points="0,600 800,600 800,430 0,430" fill="#120a33"/>
  <!-- two parallel rails converging with perspective, still visually parallel near viewer -->
  <polygon points="230,600 330,600 400,300 380,300" fill="url(#rail)"/>
  <polygon points="470,600 570,600 420,300 400,300" fill="url(#rail)"/>
  <!-- sleepers -->
  <g stroke="#78350f" stroke-width="14" opacity="0.9">
    <line x1="200" y1="560" x2="600" y2="560"/>
    <line x1="230" y1="500" x2="570" y2="500"/>
    <line x1="255" y1="450" x2="545" y2="450"/>
    <line x1="278" y1="410" x2="522" y2="410"/>
    <line x1="298" y1="375" x2="502" y2="375"/>
    <line x1="315" y1="345" x2="485" y2="345"/>
  </g>
  <!-- arrow marks showing "never meet" -->
  <g stroke="#38bdf8" stroke-width="4" fill="none">
    <path d="M340 320 L330 300 L350 300 Z" fill="#38bdf8"/>
    <path d="M460 320 L450 300 L470 300 Z" fill="#38bdf8"/>
  </g>
  <text x="400" y="80" fill="#facc15" font-family="Georgia, serif" font-size="34" font-weight="900" text-anchor="middle">∥ Parallel Forever ∥</text>
</svg>
