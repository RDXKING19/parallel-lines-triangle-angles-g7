<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b6b"/><stop offset="100%" stop-color="#0d0a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky4)"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#38bdf8" stroke-width="8"/>
  <line x1="60" y1="400" x2="740" y2="400" stroke="#38bdf8" stroke-width="8"/>
  <line x1="230" y1="80" x2="570" y2="520" stroke="#facc15" stroke-width="8"/>
  <circle cx="330" cy="200" r="8" fill="#fff"/>
  <circle cx="470" cy="400" r="8" fill="#fff"/>
  <!-- Z shape: bottom-right at top intersection to top-left at bottom intersection -->
  <path d="M 470 200 L 330 200 L 330 260 L 470 400 L 400 400" fill="none" stroke="#f472b6" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <text x="360" y="240" fill="#f472b6" font-size="26" font-weight="900">b°</text>
  <text x="415" y="380" fill="#f472b6" font-size="26" font-weight="900">b°</text>
  <text x="400" y="70" fill="#facc15" font-family="Georgia, serif" font-size="30" font-weight="900" text-anchor="middle">Alternate Angles = "Z" Shape</text>
  <rect x="255" y="520" width="290" height="56" rx="16" fill="#1e0e45" stroke="#f472b6" stroke-width="3"/>
  <text x="400" y="556" fill="#f472b6" font-family="monospace" font-size="22" font-weight="900" text-anchor="middle">Equal Angles, Opposite Sides</text>
</svg>
