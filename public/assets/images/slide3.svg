<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b6b"/><stop offset="100%" stop-color="#0d0a2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky3)"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#38bdf8" stroke-width="8"/>
  <line x1="60" y1="400" x2="740" y2="400" stroke="#38bdf8" stroke-width="8"/>
  <line x1="230" y1="80" x2="570" y2="520" stroke="#facc15" stroke-width="8"/>
  <circle cx="330" cy="200" r="8" fill="#fff"/>
  <circle cx="470" cy="400" r="8" fill="#fff"/>
  <!-- Highlight the F shape: top-right corner at first intersection + top-right corner at second -->
  <path d="M 330 200 L 470 200 L 470 340" fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <!-- highlighted angle arcs -->
  <path d="M 360 200 A 30 30 0 0 1 345 227" fill="none" stroke="#4ade80" stroke-width="5"/>
  <path d="M 500 400 A 30 30 0 0 1 485 427" fill="none" stroke="#4ade80" stroke-width="5"/>
  <text x="380" y="185" fill="#4ade80" font-size="28" font-weight="900">a°</text>
  <text x="520" y="385" fill="#4ade80" font-size="28" font-weight="900">a°</text>
  <text x="400" y="70" fill="#facc15" font-family="Georgia, serif" font-size="30" font-weight="900" text-anchor="middle">Corresponding Angles = "F" Shape</text>
  <rect x="255" y="520" width="290" height="56" rx="16" fill="#1e0e45" stroke="#4ade80" stroke-width="3"/>
  <text x="400" y="556" fill="#4ade80" font-family="monospace" font-size="22" font-weight="900" text-anchor="middle">Equal Angles, Same Corner</text>
</svg>
